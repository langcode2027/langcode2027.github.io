name: Update Task 2 leaderboard

# Every day at 12:00 AM EST (05:00 UTC), and by hand from the Actions tab.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # the runner's own python3 runs the scripts (standard library only)

      - name: Read the CodaBench leaderboards
        run: python3 scripts/update_task2_leaderboard.py

      - name: Rebuild the site
        run: python3 task-src/build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/task2_leaderboard.json task2/leaderboard/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Task 2 leaderboard update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
